name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The suite is offline by design: no fixture is re-measured here and no test
      # reads TYPESAFE_API_KEY. `jevc check --live` is the only thing that needs a
      # key, and it is never wired into CI.
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A TypeSafe key is `apikey_` + hex. The only permitted occurrence is the
      # placeholder in .env.example, which has no hex body. Scanning history as well
      # as the tree, because a key that ever landed in a commit is already burned.
      - name: Reject a committed API key
        run: |
          if git grep -nIE 'apikey_[0-9a-f]{16}' $(git rev-list --all) -- 2>/dev/null; then
            echo "::error::A TypeSafe API key appears in the repository history."
            exit 1
          fi
          echo "no key found in any commit"
